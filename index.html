<!DOCTYPE html>
<html>
<head><title>Button Test</title></head>
<body style="background:#064e3b; color:white; text-align:center; padding:50px;">
    <h1>🧪 Button Test</h1>
    <input type="password" id="p" placeholder="Password" style="padding:10px; font-size:16px;">
    <button onclick="test()" style="padding:15px 30px; font-size:18px; background:#059669; color:white; border:none; border-radius:8px; margin-top:10px;">
        Click Me
    </button>
    <p id="r" style="margin-top:20px; font-size:18px; color:yellow;"></p>
    <script>
        function test() {
            document.getElementById('r').innerText = '✅ Button works! Password: ' + document.getElementById('p').value;
        }
    </script>
</body>
</html>
