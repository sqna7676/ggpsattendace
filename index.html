<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGPS Dashboard - Final Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

    <!-- Login Screen -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full text-center border-t-4 border-emerald-600">
            <h1 class="text-2xl font-bold text-slate-800 mb-2">GGPS Jheran Wali</h1>
            <p class="text-sm text-slate-500 mb-6">Smart School System</p>
            
            <input type="email" id="email" value="sqna7676@gmail.com" placeholder="Email" class="w-full p-3 border rounded-lg mb-3 text-left">
            <input type="password" id="password" placeholder="Password" class="w-full p-3 border rounded-lg mb-4 text-left">
            
            <button onclick="doLogin()" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold hover:bg-emerald-700">
                🔓 Sign In
            </button>
            <p id="error" class="text-red-500 text-xs mt-3 hidden"></p>
        </div>
    </div>

    <!-- Dashboard Screen (Hidden by default) -->
    <div id="dashboard" class="hidden min-h-screen">
        <header class="bg-emerald-800 text-white p-4 shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold">🏫 GGPS Dashboard</h1>
            <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded text-sm">Logout</button>
        </header>
        
        <main class="p-4 max-w-4xl mx-auto">
            <div class="bg-white p-6 rounded-xl shadow mb-4">
                <h2 class="text-xl font-bold text-slate-800 mb-2">🎉 مبارک ہو! لاگ ان کامیاب ہے!</h2>
                <p class="text-slate-600">آپ کا نیا ڈیش بورڈ اب بالکل ٹھیک کام کر رہا ہے۔</p>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-blue-500">
                    <p class="text-xs text-slate-500">Total Students</p>
                    <p class="text-2xl font-bold text-slate-800">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-green-500">
                    <p class="text-xs text-slate-500">Present Today</p>
                    <p class="text-2xl font-bold text-slate-800">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-red-500">
                    <p class="text-xs text-slate-500">Absent Today</p>
                    <p class="text-2xl font-bold text-slate-800">0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow border-l-4 border-amber-500">
                    <p class="text-xs text-slate-500">Teachers</p>
                    <p class="text-2xl font-bold text-slate-800">0</p>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4CamdJGCWGMjO-uR3_WOvvq2RwSMnHZc",
            authDomain: "ggps-jheran-wali-91e0c.firebaseapp.com",
            projectId: "ggps-jheran-wali-91e0c",
            storageBucket: "ggps-jheran-wali-91e0c.firebasestorage.app",
            messagingSenderId: "703458166473",
            appId: "1:703458166473:web:cedabf9fddb16199a66f18"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.doLogin = async function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errEl = document.getElementById('error');
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                errEl.innerText = "Error: " + e.message;
                errEl.classList.remove('hidden');
            }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
